services:
  postgres:
    image: postgres:15-alpine
    container_name: clauseguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard_secret
      POSTGRES_DB: clauseguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard -d clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clauseguard_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://clauseguard:clauseguard_secret@postgres:5432/clauseguard
      SECRET_KEY: clauseguard_super_secret_jwt_key_change_in_production_min_32_chars
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ML_MODE: mock
      MODEL_DIR: /app/models
      UPLOAD_DIR: /app/data/uploads
      REPORT_DIR: /app/data/reports
      MAX_UPLOAD_MB: 20
      MAX_PAGES: 60
      CONFIDENCE_THRESHOLD: 0.5
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
      SEED_ADMIN_EMAIL: admin@clauseguard.local
      SEED_ADMIN_PASSWORD: AdminSecurePass123!
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/reports:/app/data/reports
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clauseguard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
