model_name: "nlpaueb/legal-bert-base-uncased"
dataset_name: "coastalcph/lex_glue"
dataset_config: "ledgar"
max_seq_length: 256
learning_rate: 3.0e-5
weight_decay: 0.01
num_train_epochs: 3
batch_size: 16
gradient_accumulation_steps: 1
warmup_ratio: 0.06
output_dir: "models/classifier"
reports_dir: "ml/reports"
mappings_dir: "ml/mappings"
seed: 42
target_accuracy: 0.85
min_acceptable_accuracy: 0.80
use_fp16: true
eval_batch_size: 32
