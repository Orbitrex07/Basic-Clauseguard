model_name: "nlpaueb/legal-bert-base-uncased"
dataset_name: "theatticusproject/cuad-qa"
alt_dataset_name: "cuad"
max_seq_length: 512
doc_stride: 128
max_answer_length: 256
n_best: 20
learning_rate: 3.0e-5
weight_decay: 0.01
num_train_epochs: 2
batch_size: 8
gradient_accumulation_steps: 2
output_dir: "models/extractor"
reports_dir: "ml/reports"
mappings_dir: "ml/mappings"
seed: 42
use_fp16: true
eval_batch_size: 16
